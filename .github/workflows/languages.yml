name: Languages Metrics

on:
  schedule:
    - cron: "0 0 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  languages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Count languages by projects & files
        run: node scripts/languages.mjs
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          SKIP_REPOS: "" # comma-separated repo names to exclude

      - name: Publish to metrics branch
        run: |
          mkdir -p /tmp/out && mv languages.svg /tmp/out/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin metrics || true
          if git rev-parse --verify origin/metrics >/dev/null 2>&1; then
            git checkout -B metrics origin/metrics
          else
            git checkout --orphan metrics && git rm -rf . >/dev/null
          fi
          cp /tmp/out/languages.svg .
          git add languages.svg
          git commit -m "Update languages.svg" || exit 0
          git push origin metrics
