# Generates the contribution snake in the profile's colors (dark navy + mint green).
name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *" # every 12 hours
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=#2BDE98&color_dots=#161B22,#0E4429,#006D32,#26A641,#2BDE98&color_dot_border=#0D1117&color_background=#0D1117
            dist/github-contribution-grid-snake.svg?color_snake=#302B63&color_dots=#EBEDF0,#B5F5DA,#7EECBF,#4FE4A6,#2BDE98&color_dot_border=#FFFFFF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: Update snake animation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
